# One-off: update vulnerable packages and commit the lockfile back, then delete this file.
name: deps-update
on:
  push:
    branches: [ci/github-actions]
    paths: ['.github/workflows/deps-update.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ci/github-actions
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Update packages
        shell: bash
        run: |
          enc() { sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          npm install sharp@0.35.5 > step.txt 2>&1 || { echo "::error title=npm install::$(tail -n 40 step.txt | enc)"; exit 1; }
          echo "::notice title=versions::$(node -p "['sharp'].map(n=>n+'@'+require('./node_modules/'+n+'/package.json').version).join(', ')")"
          npm audit --omit=dev --audit-level=high > audit.txt 2>&1 && echo "::notice title=audit::clean" || echo "::warning title=audit::$(head -n 40 audit.txt | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
      - name: Commit lockfile and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/deps-update.yml
          git add package.json package-lock.json
          git commit -m "deps: update sharp to 0.35.5 (libvips/libheif/librsvg security fixes)"
          git push
