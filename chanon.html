<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตั้งค่าระบบ | หลังบ้าน คลังข่าว มรส.</title>

    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.classList.toggle('dark', t === 'dark');
      document.documentElement.classList.add('js');
    })();

  <link rel="preload" href="/assets/fonts/NotoSansThai.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/Kanit-700.woff2" as="font" type="font/woff2" crossorigin>

<body class="app">
  <a href="#panel" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[80] rounded-xl bg-royal px-4 py-2 text-white dark:text-bg">ข้ามไปที่การตั้งค่า</a>
  <div class="flex min-h-dvh flex-col lg:h-dvh lg:flex-row">
    <header id="mbar" class="sticky top-0 z-40 flex items-center gap-3 border-b border-line bg-shell/95 px-4 py-2.5 shadow-raised backdrop-blur-xl lg:hidden"></header>
    <div id="scrim" class="fixed inset-0 z-40 bg-[rgb(10_11_32/.45)] lg:hidden" aria-hidden="true"></div>
    <aside id="side" class="scroll-thin fixed inset-y-0 left-0 z-50 flex w-[272px] flex-col overflow-y-auto bg-bg px-4 pb-4 pt-5 shadow-float lg:static lg:z-auto lg:w-[248px] lg:shrink-0 lg:bg-transparent lg:shadow-none" aria-label="เมนูหลังบ้าน"></aside>

    <main id="main" class="flex min-h-0 min-w-0 flex-1 flex-col gap-3 p-2 sm:p-3 lg:flex-row lg:pl-0">
      <section id="gate" class="m-auto flex max-w-[520px] flex-col items-center gap-4 rounded-card border border-line bg-shell p-8 text-center shadow-float" hidden></section>

      <nav id="secNav" class="no-scrollbar flex gap-1 overflow-x-auto rounded-card bg-shell p-2 shadow-raised lg:w-[210px] lg:shrink-0 lg:flex-col lg:overflow-visible lg:p-3" aria-label="หมวดการตั้งค่า" hidden></nav>
      <section id="panel" class="scroll-thin min-h-0 min-w-0 flex-1 overflow-y-auto rounded-card bg-shell shadow-raised" aria-live="polite" hidden></section>
    </main>
  </div>

  <script>window.SERVER_AUTH = true;</script>
  <script src="auth.js"></script>
  <script src="arrivals.js"></script>
  <script src="desk.js"></script>
  <script>
    const { esc, day, dayTime, num, toast, ROLE_TH } = DESK;
    const $ = (s) => document.querySelector(s);
    const SECTIONS = [
      ['users', 'ผู้ใช้และบทบาท'], ['org', 'ผังหน่วยงาน'], ['categories', 'ประเภทข่าว'], ['media', 'ภาพและวิดีโอ'],
      ['review', 'เวลาตรวจข่าว'], ['messages', 'ข้อความแจ้งเตือน'], ['mail', 'อีเมลแจ้งเตือน'], ['requests', 'คำขอข้อมูลส่วนบุคคล'], ['retention', 'ระยะเวลาเก็บข้อมูล'], ['backups', 'สำรองข้อมูล'], ['audit', 'ประวัติการใช้งาน'],
    ];
    const PLATFORM = { youtube: 'YouTube', facebook: 'Facebook', tiktok: 'TikTok', drive: 'Google Drive' };
    const MSG = { published: 'เมื่อเผยแพร่แล้ว', revise: 'เมื่อขอให้แก้ไข', writing: 'เมื่อ PR รับไปเขียนข่าว' };
    let S = null; // { settings, defaults, fileOrg, ... }
    let me = null;

    const head = (title, text) => `<div class="border-b border-line p-5 sm:px-6"><h1 class="font-display tight text-[24px] font-bold text-royal">${title}</h1><p class="mt-1 max-w-[72ch] text-[14px] text-ink2">${text}</p></div>`;
    const saveBar = (id, extra = '') => `<div class="sticky bottom-0 flex flex-wrap items-center justify-end gap-2 border-t border-line bg-shell/95 px-5 py-3 backdrop-blur sm:px-6">${extra}
      <button type="button" id="${id}" class="bg-grad press t-spring h-11 rounded-2xl px-6 font-display text-[15px] font-semibold text-white shadow-glow hover:-translate-y-0.5 disabled:opacity-60">บันทึก</button></div>`;
    async function save(key, value, btn) {
      if (btn) btn.disabled = true;
      try {
        const r = await api(`/admin/settings/${key}`, { method: 'PUT', body: { value } });
        S.settings[key] = r.value;
        toast('บันทึกแล้ว มีผลกับทุกหน้าทันที');
        return true;
      } catch (err) { toast(err.message, true); return false; } finally { if (btn) btn.disabled = false; }
    }

    // ================= Users and roles =================
    const ROLE_OPTS = [['default', 'ตามโดเมนอีเมล'], ['intern', 'นักศึกษาฝึกงาน สสอ.'], ['coordinator', 'ผู้ประสานงานหน่วยงาน'], ['secretary', 'เลขานุการผู้บริหาร'], ['executive', 'ผู้บริหาร'], ['pr', 'ทีม PR'], ['admin', 'ผู้ดูแลระบบ']];
    const UNITS = () => { const o = S.settings.org || S.fileOrg; return [...o.staffGroups.flatMap((g) => g.units), ...Object.keys(o.faculties)]; };
    const usersState = { q: '', role: '', offset: 0 };
    function roleSelect(u) {
      const v = ['intern', 'coordinator', 'secretary', 'executive', 'pr', 'admin'].includes(u.role) ? u.role : 'default';
      return `<select data-role class="field sel h-10 rounded-xl pl-3 pr-9 text-[14px]" aria-label="บทบาทของ ${esc(u.email)}">${ROLE_OPTS.map(([k, l]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
    }
    async function users() {
      $('#panel').innerHTML = head('ผู้ใช้และบทบาท', 'ทุกคนที่เคยเข้าสู่ระบบ บทบาทเริ่มต้นมาจากโดเมนอีเมล (@sru.ac.th = บุคลากร, @student.sru.ac.th = นักศึกษา) ให้สิทธิ์ทีม PR ผู้ดูแลระบบ ผู้ประสานงานหน่วยงาน หรือนักศึกษาฝึกงาน สสอ. (นำเข้าข่าวย้อนหลังได้อย่างเดียว) ได้ที่นี่ ให้สิทธิ์ล่วงหน้าก่อนผู้ใช้เข้าสู่ระบบครั้งแรกได้') + `
        <div class="grid gap-4 p-5 sm:px-6">
          <form id="grant" class="grid gap-2 rounded-card border border-line bg-surface2/50 p-4 sm:grid-cols-[minmax(0,1.3fr)_200px_minmax(0,1fr)_auto] sm:items-end">
            <label class="grid gap-1"><span class="font-display text-[14px] font-semibold">ให้สิทธิ์อีเมล</span><input name="email" type="email" required placeholder="ชื่อ@sru.ac.th" class="field h-11 rounded-xl px-3 text-[15px]"></label>
            <label class="grid gap-1"><span class="font-display text-[14px] font-semibold">บทบาท</span><select name="role" class="field sel h-11 rounded-xl pl-3 pr-9 text-[15px]">${ROLE_OPTS.slice(1).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></label>
            <label class="grid gap-1" data-unitbox><span class="font-display text-[14px] font-semibold">หน่วยงานที่ดูแล</span><input name="unit" list="unitList" placeholder="สำหรับผู้ประสานงาน" class="field h-11 rounded-xl px-3 text-[15px]"></label>
            <button class="press t-spring h-11 rounded-xl bg-royal px-5 font-display text-[15px] font-semibold text-white dark:text-bg hover:-translate-y-0.5">ให้สิทธิ์</button>
          </form>
          <datalist id="unitList">${UNITS().map((u) => `<option value="${esc(u)}"></option>`).join('')}</datalist>
          <div class="flex flex-wrap items-center gap-2">
            <div id="roleChips" class="flex flex-wrap gap-1"></div>
            <input id="userQ" type="search" placeholder="ค้นหาชื่อ อีเมล หรือหน่วยงาน" value="${esc(usersState.q)}" class="field ml-auto h-10 w-full rounded-full px-4 text-[14px] sm:w-[280px]">
          </div>
          <div id="userList" class="grid gap-1"></div>
        </div>`;
      const form = $('#grant');
      const syncUnit = () => { form.querySelector('[data-unitbox]').hidden = form.role.value !== 'coordinator'; };
      form.role.addEventListener('change', syncUnit); syncUnit();
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          await api('/admin/roles', { method: 'PUT', body: { email: form.email.value, role: form.role.value, unit: form.unit.value } });
          toast(`ให้สิทธิ์ ${form.email.value} แล้ว`);
          form.reset(); syncUnit(); loadUsers();
        } catch (err) { toast(err.message, true); }
      });
      let t;
      $('#userQ').addEventListener('input', (e) => { clearTimeout(t); t = setTimeout(() => { usersState.q = e.target.value.trim(); usersState.offset = 0; loadUsers(); }, 250); });
      loadUsers();
    }
    async function loadUsers() {
      const p = new URLSearchParams({ limit: 50, offset: usersState.offset });
      if (usersState.q) p.set('q', usersState.q);
      if (usersState.role) p.set('role', usersState.role);
      const r = await api('/admin/users?' + p).catch((err) => { toast(err.message, true); return null; });
      if (!r) return;
      const chip = (k, l) => `<button type="button" data-rolef="${k}" aria-pressed="${usersState.role === k}" class="press t-quick h-9 rounded-full px-3 font-display text-[13px] font-semibold ${usersState.role === k ? 'bg-grad text-white shadow-glow' : 'border border-line'}">${l}${k ? ` ${num(r.counts[k] || 0)}` : ''}</button>`;
      $('#roleChips').innerHTML = chip('', 'ทั้งหมด') + ['admin', 'pr', 'coordinator', 'intern', 'secretary', 'executive', 'staff', 'student', 'external'].map((k) => chip(k, ROLE_TH[k])).join('');
      $('#userList').innerHTML = r.items.length ? r.items.map((u) => `
        <div class="grid items-center gap-2 rounded-2xl border border-line p-3 sm:grid-cols-[minmax(0,1fr)_200px_minmax(0,220px)_auto]" data-email="${esc(u.email)}">
          <div class="min-w-0"><p class="truncate font-display text-[15px] font-semibold">${esc(u.name || u.email)}</p>
            <p class="truncate text-[13px] text-ink2">${esc(u.email)}${u.affiliation ? `, ${esc(u.affiliation)}` : ''}</p>
            <p class="text-[12px] text-ink2">${u.signedIn ? (u.lastLoginAt ? `เข้าสู่ระบบล่าสุด ${dayTime(u.lastLoginAt)}` : '') : 'ให้สิทธิ์ล่วงหน้า ยังไม่เคยเข้าสู่ระบบ'}</p></div>
          ${u.developer ? '<span class="justify-self-start rounded-full bg-grad px-3 font-display text-[13px] font-semibold leading-7 text-white">ผู้พัฒนาระบบ</span>' : roleSelect(u)}
          <input data-unit list="unitList" value="${esc(u.coordUnit || '')}" placeholder="หน่วยงานที่ดูแล" aria-label="หน่วยงานที่ ${esc(u.email)} ดูแล" class="field h-10 rounded-xl px-3 text-[14px]" ${u.role === 'coordinator' ? '' : 'hidden'}>
          <button type="button" data-apply class="press t-quick h-10 rounded-xl border border-line px-4 font-display text-[14px] font-medium hover:-translate-y-0.5" hidden>บันทึก</button>
        </div>`).join('') : '<p class="rounded-2xl border border-dashed border-line p-8 text-center text-ink2">ไม่พบผู้ใช้</p>';
    }
    document.addEventListener('click', (e) => { const b = e.target.closest('[data-rolef]'); if (b) { usersState.role = b.dataset.rolef; usersState.offset = 0; loadUsers(); } });
    document.addEventListener('change', (e) => {
      const row = e.target.closest('[data-email]');
      if (!row || !e.target.matches('[data-role], [data-unit]')) return;
      row.querySelector('[data-unit]').hidden = row.querySelector('[data-role]').value !== 'coordinator';
      row.querySelector('[data-apply]').hidden = false;
    });
    document.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-apply]');
      if (!b) return;
      const row = b.closest('[data-email]');
      try {
        await api('/admin/roles', { method: 'PUT', body: { email: row.dataset.email, role: row.querySelector('[data-role]').value, unit: row.querySelector('[data-unit]').value } });
        toast('บันทึกบทบาทแล้ว มีผลเมื่อผู้ใช้โหลดหน้าใหม่');
        loadUsers();
      } catch (err) { toast(err.message, true); }
    });

    // ================= Org chart =================
    // Text format: "# group", unit lines, "- sub-unit" under a unit. Faculties: name lines, "- major" or "- major: track, track".
    function orgToText(o) {
      const staff = o.staffGroups.map((g) => [`# ${g.label}`, ...g.units.flatMap((u) => [u, ...(o.subUnits[u]?.units || []).map((s) => `- ${s}`)])].join('\n')).join('\n\n');
      const fac = Object.entries(o.faculties).map(([f, v]) => [f, ...v.majors.map((m) => typeof m === 'string' ? `- ${m}` : `- ${m.name}: ${m.tracks.join(', ')}`)].join('\n')).join('\n\n');
      return { staff, fac };
    }
    function textToOrg(staff, fac, prev) {
      const staffGroups = [], subUnits = {}, faculties = {};
      let group = null, unit = null;
      staff.split('\n').map((l) => l.trim()).forEach((l, i) => {
        if (!l) return;
        if (l.startsWith('#')) { group = { label: l.replace(/^#+\s*/, ''), units: [] }; staffGroups.push(group); unit = null; return; }
        if (l.startsWith('-')) {
          if (!unit) throw new Error(`บรรทัด ${i + 1}: หน่วยงานย่อยต้องอยู่ใต้หน่วยงานหลัก`);
          const p = prev.subUnits[unit];
          subUnits[unit] ||= { label: p?.label || 'หน่วยงานย่อย', required: p ? p.required !== false : true, units: [] };
          subUnits[unit].units.push(l.replace(/^-\s*/, ''));
          return;
        }
        if (!group) throw new Error(`บรรทัด ${i + 1}: ขึ้นต้นด้วยชื่อกลุ่ม เช่น # คณะ / วิทยาลัย`);
        unit = l; group.units.push(l);
      });
      let f = null;
      fac.split('\n').map((l) => l.trim()).forEach((l, i) => {
        if (!l) return;
        if (l.startsWith('-')) {
          if (!f) throw new Error(`คณะ บรรทัด ${i + 1}: สาขาต้องอยู่ใต้ชื่อคณะ`);
          const [name, tracks] = l.replace(/^-\s*/, '').split(/:\s*/);
          faculties[f].majors.push(tracks ? { name: name.trim(), tracks: tracks.split(',').map((t) => t.trim()).filter(Boolean) } : name.trim());
          return;
        }
        f = l;
        faculties[f] = { ...(prev.faculties[f]?.majorLabel ? { majorLabel: prev.faculties[f].majorLabel } : {}), majors: [] };
      });
      return { staffGroups, subUnits, faculties };
    }
    function org() {
      const o = S.settings.org || S.fileOrg;
      const t = orgToText(o);
      const count = o.staffGroups.reduce((a, g) => a + g.units.length, 0);
      $('#panel').innerHTML = head('ผังหน่วยงาน', `รายชื่อหน่วยงานที่ใช้ในหน้าเข้าสู่ระบบ ฟอร์มส่งข่าว ตัวกรองค้นหา และรายงาน ตอนนี้มี ${count} หน่วยงาน ${Object.keys(o.faculties).length} คณะ${S.settings.org ? ' (แก้ไขจากหน้านี้)' : ' (จากไฟล์ org-data.js)'}`) + `
        <div class="grid gap-5 p-5 sm:px-6 xl:grid-cols-2">
          <label class="grid content-start gap-2"><span class="font-display text-[16px] font-semibold">หน่วยงานของบุคลากร</span>
            <span class="text-[13px] text-ink2"><b># ชื่อกลุ่ม</b> ขึ้นกลุ่มใหม่, หนึ่งบรรทัดต่อหนึ่งหน่วยงาน, <b>- ชื่อ</b> ใต้หน่วยงานคือหน่วยงานย่อย</span>
            <textarea id="orgStaff" rows="22" spellcheck="false" class="code-area field scroll-thin rounded-2xl px-4 py-3">${esc(t.staff)}</textarea></label>
          <label class="grid content-start gap-2"><span class="font-display text-[16px] font-semibold">คณะและสาขาของนักศึกษา</span>
            <span class="text-[13px] text-ink2">หนึ่งบรรทัดต่อหนึ่งคณะ, <b>- สาขา</b> ใต้คณะ, <b>- สาขา: วิชาเอก, วิชาเอก</b> เมื่อสาขามีวิชาเอก</span>
            <textarea id="orgFac" rows="22" spellcheck="false" class="code-area field scroll-thin rounded-2xl px-4 py-3">${esc(t.fac)}</textarea></label>
        </div>
        <p id="orgErr" class="px-6 pb-2 text-[14px] font-medium text-brand" hidden></p>` +
        saveBar('orgSave', S.settings.org ? '<button type="button" id="orgReset" class="press t-quick mr-auto h-11 rounded-2xl px-4 font-display text-[15px] font-medium text-ink2 hover:text-ink">คืนค่าจากไฟล์ org-data.js</button>' : '');
      $('#orgSave').addEventListener('click', async (e) => {
        $('#orgErr').hidden = true;
        let value;
        try { value = textToOrg($('#orgStaff').value, $('#orgFac').value, o); } catch (err) { $('#orgErr').textContent = err.message; $('#orgErr').hidden = false; return; }
        if (await save('org', value, e.currentTarget)) org();
      });
      $('#orgReset')?.addEventListener('click', async (e) => { if (await save('org', null, e.currentTarget)) org(); });
    }

    // ================= Categories =================
    function categories() {
      let list = [...S.settings.categories];
      $('#panel').innerHTML = head('ประเภทข่าว', 'ตัวเลือกในฟอร์มส่งข่าว หน้าเผยแพร่ หน้านำเข้า และตัวกรองค้นหา ผู้ส่งเลือกได้สูงสุด 5 ประเภทต่อข่าว ข่าวเก่าที่ใช้ประเภทที่ลบไปแล้วยังคงแสดงชื่อเดิม') + `
        <div class="grid max-w-[720px] gap-3 p-5 sm:px-6">
          <ol id="catList" class="grid gap-1.5"></ol>
          <form id="catAdd" class="flex gap-2"><input name="c" maxlength="40" placeholder="เพิ่มประเภทข่าว" class="field h-11 flex-1 rounded-xl px-3 text-[15px]" aria-label="ชื่อประเภทข่าวใหม่">
            <button class="press t-spring h-11 rounded-xl bg-royal px-5 font-display text-[15px] font-semibold text-white dark:text-bg hover:-translate-y-0.5">เพิ่ม</button></form>
        </div>` + saveBar('catSave');
      const paint = () => {
        $('#catList').innerHTML = list.map((c, i) => `<li class="flex items-center gap-2 rounded-2xl border border-line py-1.5 pl-4 pr-1.5">
          <span class="w-6 text-[13px] text-ink2">${i + 1}</span><span class="flex-1 font-display text-[15px] font-medium">${esc(c)}</span>
          <button type="button" data-mv="${i},-1" class="icon-btn grid h-9 w-9 place-items-center rounded-full text-ink2 hover:text-ink disabled:opacity-30" ${i ? '' : 'disabled'} aria-label="เลื่อน ${esc(c)} ขึ้น"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
          <button type="button" data-mv="${i},1" class="icon-btn grid h-9 w-9 place-items-center rounded-full text-ink2 hover:text-ink disabled:opacity-30" ${i < list.length - 1 ? '' : 'disabled'} aria-label="เลื่อน ${esc(c)} ลง"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
          <button type="button" data-rm="${i}" class="icon-btn grid h-9 w-9 place-items-center rounded-full text-brand" aria-label="ลบ ${esc(c)}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></li>`).join('');
      };
      paint();
      $('#catList').addEventListener('click', (e) => {
        const mv = e.target.closest('[data-mv]'), rm = e.target.closest('[data-rm]');
        if (mv) { const [i, d] = mv.dataset.mv.split(',').map(Number); [list[i], list[i + d]] = [list[i + d], list[i]]; paint(); }

              <dl class="mt-3 grid gap-3 text-[14px] sm:grid-cols-3">
                <div><dt class="text-[13px] text-ink2">ฐานข้อมูล</dt><dd>${b.db ? `${mb(b.db.size)} · ${num(b.db.tables)} ตาราง · ข่าว ${num(b.db.counts.news)} · ผู้ใช้ ${num(b.db.counts.users)}` : 'ไม่มี'}</dd></div>
                <div><dt class="text-[13px] text-ink2">ไฟล์ภาพและเอกสาร</dt><dd>${b.media ? `${num(b.media.files)} ไฟล์ ${mb(b.media.bytes)} · คัดลอกใหม่ ${num(b.media.copied)} ไฟล์` : 'ไม่มี'}</dd></div>
                <div><dt class="text-[13px] text-ink2">สำเนานอกเครื่อง</dt><dd>${b.offsite?.ok ? 'คัดลอกแล้ว' : b.offsite?.skipped ? 'ยังไม่ได้ตั้งค่า' : b.offsite ? `ไม่สำเร็จ: ${esc(b.offsite.error || '')}` : '–'}</dd></div>
              </dl>
              ${b.errors.length ? `<p class="mt-3 text-[13px] text-brand">${b.errors.map(esc).join('<br>')}</p>` : ''}` : '<p class="mt-2 text-[14px] text-ink2">ยังไม่มีผลการสำรองข้อมูล เรียก npm run backup บนเซิร์ฟเวอร์</p>'}
          </section>
          <section class="rounded-card border border-line p-4" aria-labelledby="rtTitle">
            <div class="flex flex-wrap items-center gap-2"><h2 id="rtTitle" class="mr-auto font-display text-[17px] font-semibold">ทดลองกู้คืนล่าสุด</h2>${t ? okBadge(t.ok, 'ผ่าน', 'ไม่ผ่าน') : ''}</div>
            ${t ? `<p class="mt-1 text-[13px] text-ink2">${dayTime(t.at)} จาก ${esc(t.dump || '')}${t.snapshot ? ` และ ${esc(t.snapshot)}` : ''}</p>
              <ul class="mt-3 grid gap-1 text-[14px]">${t.checks.map((c) => `<li class="flex gap-2"><span class="${c.ok ? 'text-sky' : 'text-brand'}" aria-hidden="true">${c.ok ? '✓' : '✗'}</span><span><span class="sr-only">${c.ok ? 'ผ่าน' : 'ไม่ผ่าน'}: </span>${esc(c.what)}</span></li>`).join('')}</ul>
              ${t.errors.length && !t.checks.length ? `<p class="mt-2 text-[13px] text-brand">${t.errors.map(esc).join('<br>')}</p>` : ''}` : '<p class="mt-2 text-[14px] text-ink2">ยังไม่เคยทดลองกู้คืน เรียก npm run backup:restore-test บนเซิร์ฟเวอร์</p>'}
          </section>
        </div>`;
    }

    // ================= Usage history =================
    const auditState = { action: '', q: '', from: '', to: '', offset: 0 };
    async function audit() {
      $('#panel').innerHTML = head('ประวัติการใช้งาน', 'ทุกการเปลี่ยนแปลงในหลังบ้าน: ใคร ทำอะไร เมื่อไร') + `
        <div class="grid gap-3 p-5 sm:px-6">
          <div class="flex flex-wrap items-end gap-2">
            <label class="grid gap-1 text-[13px]">การกระทำ<select id="aAction" class="field sel h-10 rounded-xl pl-3 pr-9 text-[14px]"><option value="">ทั้งหมด</option></select></label>
            <label class="grid gap-1 text-[13px]">ตั้งแต่<input id="aFrom" type="date" value="${auditState.from}" class="field h-10 rounded-xl px-3 text-[14px]"></label>
            <label class="grid gap-1 text-[13px]">ถึง<input id="aTo" type="date" value="${auditState.to}" class="field h-10 rounded-xl px-3 text-[14px]"></label>
            <input id="aQ" type="search" value="${esc(auditState.q)}" placeholder="ค้นหาชื่อ อีเมล หรือรายละเอียด" class="field ml-auto h-10 w-full rounded-full px-4 text-[14px] sm:w-[280px]">
          </div>
          <ol id="aList" class="grid gap-1"></ol>
          <div class="flex items-center justify-between text-[13px] text-ink2"><span id="aInfo"></span>
            <span class="flex gap-2"><button id="aPrev" type="button" class="press t-quick h-9 rounded-full border border-line px-4 font-display text-[14px] disabled:opacity-40">ก่อนหน้า</button>
            <button id="aNext" type="button" class="press t-quick h-9 rounded-full border border-line px-4 font-display text-[14px] disabled:opacity-40">ถัดไป</button></span></div>
        </div>`;
      const reload = () => { auditState.offset = 0; loadAudit(); };
      $('#aAction').addEventListener('change', (e) => { auditState.action = e.target.value; reload(); });
      $('#aFrom').addEventListener('change', (e) => { auditState.from = e.target.value; reload(); });
      $('#aTo').addEventListener('change', (e) => { auditState.to = e.target.value; reload(); });
      let t; $('#aQ').addEventListener('input', (e) => { clearTimeout(t); t = setTimeout(() => { auditState.q = e.target.value.trim(); reload(); }, 250); });
      $('#aPrev').addEventListener('click', () => { auditState.offset = Math.max(0, auditState.offset - 50); loadAudit(); });
      $('#aNext').addEventListener('click', () => { auditState.offset += 50; loadAudit(); });
      loadAudit(true);
    }
    const TONE = { 'privacy.erase': 'bg-red-soft text-brand', 'privacy.reject': 'bg-gold-soft text-gold', 'news.withdraw': 'bg-red-soft text-brand', 'settings.update': 'bg-gold-soft text-gold', 'role.set': 'bg-purple-soft text-purple', 'role.remove': 'bg-purple-soft text-purple', 'news.import': 'bg-sky-soft text-sky' };
    async function loadAudit(first) {
      const p = new URLSearchParams({ limit: 50, offset: auditState.offset });
      for (const k of ['action', 'q', 'from', 'to']) if (auditState[k]) p.set(k, auditState[k]);
      const r = await api('/admin/audit?' + p).catch((err) => { toast(err.message, true); return null; });
      if (!r) return;
      if (first) $('#aAction').insertAdjacentHTML('beforeend', Object.entries(r.actions).map(([k, l]) => `<option value="${k}" ${k === auditState.action ? 'selected' : ''}>${l}</option>`).join(''));
      $('#aList').innerHTML = r.items.length ? r.items.map((a) => `
        <li class="grid gap-1 rounded-2xl border border-line px-4 py-2.5 sm:grid-cols-[150px_minmax(0,1fr)_auto] sm:items-center sm:gap-4">
          <time datetime="${a.at}" class="text-[13px] text-ink2">${dayTime(a.at)}</time>
          <span class="min-w-0"><span class="block text-[15px]">${esc(a.summary)}</span><span class="block truncate text-[12px] text-ink2">โดย ${esc(a.actor)}${a.actorEmail && a.actor !== a.actorEmail ? ` (${esc(a.actorEmail)})` : ''}</span></span>
          <span class="justify-self-start rounded-full px-2.5 font-display text-[12px] font-semibold leading-6 sm:justify-self-end ${TONE[a.action] || 'bg-royal-soft text-royal'}">${esc(a.actionLabel)}</span>
        </li>`).join('') : '<li class="rounded-2xl border border-dashed border-line p-8 text-center text-ink2">ยังไม่มีประวัติที่ตรงกับตัวกรอง</li>';
      $('#aInfo').textContent = r.total ? `${num(auditState.offset + 1)}–${num(auditState.offset + r.items.length)} จาก ${num(r.total)} รายการ` : '';
      $('#aPrev').disabled = auditState.offset === 0;
      $('#aNext').disabled = auditState.offset + r.items.length >= r.total;
    }

    // ================= Routing (#section) =================
    const RENDER = { users, org, categories, media, review, messages, mail, requests, retention, backups, audit };
    function show() {
      const id = SECTIONS.some(([k]) => k === location.hash.slice(1)) ? location.hash.slice(1) : 'users';
      document.querySelectorAll('#secNav a').forEach((a) => a.setAttribute('aria-current', String(a.dataset.sec === id)));
      $('#panel').scrollTop = 0;
      RENDER[id]();
    }
    window.addEventListener('hashchange', show);

    DESK.start({ page: 'admin', allow: ['admin'] }).then(async (user) => {
      if (!user) return;
      me = user;
      try { S = await api('/admin/settings'); } catch (err) { toast(err.message, true); return; }
      $('#secNav').innerHTML = SECTIONS.map(([k, l]) => `<a href="#${k}" data-sec="${k}" class="sec-link press t-quick inline-flex h-11 shrink-0 items-center rounded-2xl px-3 font-display text-[15px] font-medium">${l}</a>`).join('');
      $('#secNav').hidden = false;
      $('#panel').hidden = false;
      show();
    });
  </script>
</body>
</html>
