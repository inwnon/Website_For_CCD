# Coolify (Docker Compose build pack): set "Docker Compose Location" to /docker-compose.coolify.yml.
# Values come from Coolify → Environment Variables (no .env file). Steps: ops/COOLIFY.md
# Same images and hardening as docker-compose.yml; differences: no published ports (Coolify's proxy reaches the
# app over the Docker network), named volumes, and TRUST_PROXY for a proxy in another container.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-prsru}
      POSTGRES_USER: ${PGUSER:-prsru}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in Coolify}
      TZ: Asia/Bangkok
    volumes:
      - pgdata:/var/lib/postgresql/data
      - backups:/backups   # nightly pg_dump from a Coolify scheduled task (ops/COOLIFY.md)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-prsru} -d ${PGDATABASE:-prsru}"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TZ: Asia/Bangkok
      # Coolify's proxy runs in its own container on a private Docker network
      TRUST_PROXY: uniquelocal
      PGHOST: db
      PG_DUMP_VIA: local   # pg_restore installed in this image (server/restore.mjs)
      PGPORT: 5433
      PGDATABASE: ${PGDATABASE:-prsru}
      PGUSER: ${PGUSER:-prsru}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in Coolify}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN (https://domain) in Coolify}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in Coolify}
      READ_SALT: ${READ_SALT:?Set READ_SALT (long random text) in Coolify}
      ALLOW_DEV_LOGIN: 0
      UPLOAD_DIR: uploads
      BACKUP_DIR: backups
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-0}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-SRU News Hub <no-reply@sru.ac.th>}
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups:ro
    depends_on:
      db:
        condition: service_healthy

  # Off-site copy: idles until a Coolify scheduled task runs rclone in it (ops/COOLIFY.md §5).
  # Remote "sru" is defined only by environment variables, so no config file or secret lives in the repo.
  offsite:
    image: rclone/rclone:1.68.2
    restart: unless-stopped
    init: true
    entrypoint: ["sleep", "infinity"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: Asia/Bangkok
      HOME: /tmp
      RCLONE_CONFIG: /tmp/rclone.conf
      RCLONE_CACHE_DIR: /tmp/rclone-cache
      RCLONE_CONFIG_SRU_TYPE: drive
      RCLONE_CONFIG_SRU_SCOPE: drive.file
      RCLONE_CONFIG_SRU_TOKEN: ${RCLONE_DRIVE_TOKEN:-}
      RCLONE_CONFIG_SRU_TEAM_DRIVE: ${RCLONE_DRIVE_SHARED_ID:-}
    volumes:
      - backups:/backups:ro
      - uploads:/uploads:ro

  # TEMPORARY, for the move from the old server (ops/COOLIFY.md §4): pulls the dump and uploads/ down from Google Drive
  # with the same remote as offsite, because Coolify gives no SSH. Writable on purpose, so it is a separate container;
  # remove it once the move is done. Runs as root only to hand the files to the app user (1000) after copying.
  restore:
    image: rclone/rclone:1.68.2
    restart: unless-stopped
    init: true
    entrypoint: ["sleep", "infinity"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    environment:
      TZ: Asia/Bangkok
      HOME: /tmp
      RCLONE_CONFIG: /tmp/rclone.conf
      RCLONE_CACHE_DIR: /tmp/rclone-cache
      RCLONE_CONFIG_SRU_TYPE: drive
      RCLONE_CONFIG_SRU_SCOPE: drive.file
      RCLONE_CONFIG_SRU_TOKEN: ${RCLONE_DRIVE_TOKEN:-}
      RCLONE_CONFIG_SRU_TEAM_DRIVE: ${RCLONE_DRIVE_SHARED_ID:-}
    volumes:
      - backups:/backups   # the dump lands in /backups/restore, which the db container also sees
      - uploads:/uploads

volumes:
  pgdata:
  uploads:
  backups:
