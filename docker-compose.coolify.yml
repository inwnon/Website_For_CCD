# Coolify (Docker Compose build pack): set "Docker Compose Location" to /docker-compose.coolify.yml.
# Values come from Coolify → Environment Variables (no .env file). Steps: ops/COOLIFY.md
# Same images and hardening as docker-compose.yml; differences: no published ports (Coolify's proxy reaches the
# app over the Docker network), named volumes, and TRUST_PROXY for a proxy in another container.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-prsru}
      POSTGRES_USER: ${PGUSER:-prsru}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in Coolify}
      TZ: Asia/Bangkok
    volumes:
      - pgdata:/var/lib/postgresql/data
      - backups:/backups   # nightly pg_dump from a Coolify scheduled task (ops/COOLIFY.md)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-prsru} -d ${PGDATABASE:-prsru}"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TZ: Asia/Bangkok
      # Coolify's proxy runs in its own container on a private Docker network
      TRUST_PROXY: uniquelocal
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-prsru}
      PGUSER: ${PGUSER:-prsru}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in Coolify}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN (https://domain) in Coolify}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in Coolify}
      READ_SALT: ${READ_SALT:?Set READ_SALT (long random text) in Coolify}
      ALLOW_DEV_LOGIN: 0
      UPLOAD_DIR: uploads
      BACKUP_DIR: backups
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-0}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-SRU News Hub <no-reply@sru.ac.th>}
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  backups:
