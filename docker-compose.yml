# Development: `npm run db:up` starts PostgreSQL only; the app runs with `npm run dev`.
# Server: `docker compose --profile app up -d` runs the database and the app together.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-prsru}
      POSTGRES_USER: ${PGUSER:-prsru}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env (copy .env.example first)}
      TZ: Asia/Bangkok
    ports:
      - "127.0.0.1:${PGPORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-prsru} -d ${PGDATABASE:-prsru}"]
      interval: 5s
      retries: 10

  app:
    profiles: ["app"]
    build: .              # Dockerfile: packages installed at build time, runs as the non-root user "node"
    image: prsru-app
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0       # inside the container; the port below is published on this machine only
      PGHOST: db
      PGPORT: 5432
      TZ: Asia/Bangkok
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"   # reached through the reverse proxy (HTTPS), not from other machines
    volumes:
      - ./uploads:/app/uploads   # a folder on this machine, so the nightly backup (ops/BACKUP.md) can read it
      - ./backups:/app/backups:ro   # read-only: admin page shows the latest backup status
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
