  <script>window.SERVER_AUTH = true;</script>
  <script src="auth.js"></script>
  <script src="arrivals.js"></script>
  <script src="desk.js"></script>
  <script src="org-data.js"></script>
  <script>
    const { toast, day, dayTime } = DESK;
    const $ = (s) => document.querySelector(s);
    const CATEGORIES = { university_order: 'คำสั่งมหาวิทยาลัย', unit_order: 'คำสั่งจากหน่วยงาน', request_memo: 'บันทึกข้อความขอความอนุเคราะห์', other: 'เอกสารอื่นๆ' };
    const FIELDS = { workTitle: '#fWork', people: '#fWho', file: '#fFile', title: '#fTitle', category: '#fCategory', unitName: '#fUnit', tags: '#fTags' };
    const MAX_PEOPLE = 5;
    const PREVIEW_WIDTH = 480;
    const PDFJS = '/assets/pdfjs-6.4.299/';
    const state = { works: [], shelf: '', asked: 0, work: null, doc: null, mode: 'new', admin: false, me: null, who: null, editWho: null };

    // Everything from the server goes in as text nodes, never as HTML
    function el(tag, props = {}, ...kids) {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(props)) {
        if (k === 'class') n.className = v;
        else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
        else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
      }
      n.append(...kids.flat().filter((x) => x != null && x !== false));
      return n;
    }
    const bytes = (n) => (n < 1024 * 1024 ? `${Math.max(1, Math.round(n / 1024))} KB` : `${(n / 1024 / 1024).toFixed(1)} MB`);
    const chip = (t) => el('span', { class: 'rounded-full bg-surface2 px-2.5 py-0.5 text-[13px] [overflow-wrap:anywhere]' }, t);
    const personal = () => el('span', { class: 'rounded-full bg-royal-soft px-2.5 py-0.5 font-display text-[13px] font-semibold text-royal' }, 'ส่วนตัว');
    const shelved = () => el('span', { class: 'rounded-full bg-surface2 px-2.5 py-0.5 font-display text-[13px] font-semibold text-ink2' }, 'เก็บเข้าคลังแล้ว');
    const categoryOf = (d) => (d.unitName ? `${CATEGORIES[d.category]} ${d.unitName}` : CATEGORIES[d.category]);

    // ---- Previews: drawn in the browser, one at a time, only when a card comes into view ----
    const previews = new Map();
    let previewQueue = Promise.resolve(), pdfLibrary = null;
    const canPreview = (d) => d.mime === 'application/pdf' || d.mime === 'image/jpeg' || d.mime === 'image/png';
    const fileUrl = (d) => `/api/documents/${d.id}/file?version=${d.version}`;
    async function loadPdfLibrary() {
      if (!pdfLibrary) {
        pdfLibrary = await import(`${PDFJS}pdf.min.mjs`);
        pdfLibrary.GlobalWorkerOptions.workerSrc = `${PDFJS}pdf.worker.min.mjs`;
      }
      return pdfLibrary;
    }
    // Only the parts of the file that the first page needs are fetched
    async function drawPdf(d) {
      const lib = await loadPdfLibrary();
      const task = lib.getDocument({ url: new URL(fileUrl(d), location.origin).href, isEvalSupported: false, disableAutoFetch: true, disableStream: true });
      try {
        const pdf = await task.promise;
        const page = await pdf.getPage(1);
        const viewport = page.getViewport({ scale: PREVIEW_WIDTH / page.getViewport({ scale: 1 }).width });
        const canvas = el('canvas', { width: Math.round(viewport.width), height: Math.round(viewport.height) });
        await page.render({ canvas, viewport }).promise;
        return canvas;
      } finally { await task.destroy(); }
    }
    async function drawImage(d) {
      const res = await fetch(fileUrl(d), { credentials: 'same-origin' });
      if (!res.ok) throw new Error('preview');
      const bitmap = await createImageBitmap(await res.blob(), { resizeWidth: PREVIEW_WIDTH, resizeQuality: 'medium' });
      const canvas = el('canvas', { width: bitmap.width, height: bitmap.height });
      canvas.getContext('2d').drawImage(bitmap, 0, 0);
      bitmap.close();
      return canvas;
    }
    async function draw(d) {
      const canvas = await (d.mime === 'application/pdf' ? drawPdf(d) : drawImage(d));
      const blob = await new Promise((done) => { canvas.toBlob(done, 'image/webp', 0.8); });
      return URL.createObjectURL(blob);
    }
    function preview(d) {
      const key = `${d.id}:${d.version}`;
      if (!previews.has(key)) {
        const job = previewQueue.then(() => draw(d)).catch(() => null); // A file that cannot be drawn keeps its file type label
        previewQueue = job;
        previews.set(key, job);
      }
      return previews.get(key);
    }
    const covers = new WeakMap();
    const coverWatch = new IntersectionObserver((seen) => {
      for (const e of seen.filter((x) => x.isIntersecting)) {
        coverWatch.unobserve(e.target);
        preview(covers.get(e.target)).then((url) => {
          if (url) e.target.append(el('img', { src: url, alt: '', class: 'doc-shot absolute inset-0 h-full w-full object-cover object-top' }));
        });
      }
    }, { rootMargin: '200px' });
    function cover(d, size) {
      const ext = d.fileName.split('.').pop().toUpperCase();
      const box = el('span', { class: `relative grid place-items-center overflow-hidden bg-surface2 ${size}` }, el('span', { class: 'font-display text-[15px] font-semibold text-ink2' }, ext));
      if (canPreview(d)) {
        covers.set(box, d);
        coverWatch.observe(box);
      }
      return box;
    }

    // ---- Cards ----
    function card(w) {
      const main = w.documents.find(canPreview) ?? w.documents[0];
      const onlyMine = w.documents.every((d) => d.accessLevel === 'private');
      return el('li', {},
        el('button', { type: 'button', class: 'doc-card press t-spring grid h-full w-full content-start overflow-hidden rounded-card bg-shell text-left shadow-raised hover:-translate-y-0.5', onclick: () => openWork(w.id) },
          cover(main, 'aspect-[4/3] w-full'),
          el('span', { class: 'grid gap-1 p-4' },
            el('span', { class: 'font-display text-[17px] font-semibold [overflow-wrap:anywhere]' }, w.title),
            el('span', { class: 'text-[14px] text-ink2 [overflow-wrap:anywhere]' }, `${w.documents.length} เอกสาร · ${[...new Set(w.documents.map((d) => CATEGORIES[d.category]))].join(', ')}`),
            el('span', { class: 'text-[14px] text-ink2' }, `แก้ไขล่าสุด ${day(w.updatedAt)}`),
            w.people.length || onlyMine ? el('span', { class: 'flex flex-wrap gap-1.5 pt-1' }, onlyMine ? personal() : null, w.people.map((p) => chip(p.name))) : null)));
    }
    function paint(filtered) {
      $('#list').replaceChildren(...state.works.map(card));
      $('#count').textContent = `${filtered ? 'พบ' : 'ทั้งหมด'} ${state.works.length} งาน`;
      $('#empty').hidden = state.works.length > 0;
      $('#empty').textContent = filtered ? 'ไม่พบงานที่ตรงกับเงื่อนไข' : state.shelf ? 'ยังไม่มีเอกสารที่เก็บเข้าคลัง' : 'ยังไม่มีงานในคลังเอกสาร';
      document.querySelectorAll('[data-shelf]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.shelf === state.shelf)));
    }
    // Only the latest search paints: an older, slower answer is dropped
    async function load() {
      const q = $('#search').value.trim(), category = $('#filter').value;
      const asked = ++state.asked;
      const params = new URLSearchParams();
      if (q) params.set('q', q);
      if (category) params.set('category', category);
      if (state.shelf) params.set('archived', '1');
      try {
        const r = await api(`/document-works?${params}`);
        if (asked !== state.asked) return;
        state.works = r.items;
        paint(Boolean(q || category));
      } catch (err) { toast(err.message, true); }
    }

    // window.api sends JSON; a file goes as multipart. A proxy in front of the app answers an oversized file without JSON.
    async function sendFile(path, data, file) {
      const body = new FormData();
      body.append('data', JSON.stringify(data));
      if (file) body.append('file', file);
      const res = await fetch(`/api${path}`, { method: 'POST', credentials: 'same-origin', body });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) throw Object.assign(new Error(out.error || (res.status === 413 ? 'ไฟล์ใหญ่เกินกำหนด' : 'อัปโหลดไม่สำเร็จ กรุณาลองใหม่อีกครั้ง')), { status: res.status, details: out.details });
      return out;
    }

    // People named on a งาน: the two forms share this
    function picker({ list, search, found, onError }) {
      let chosen = [], timer = null;
      function paintChosen() {
        $(list).replaceChildren(...chosen.map((p) => el('li', {},
          el('button', { type: 'button', 'aria-label': `เอา ${p.name} ออก`, class: 'hover-fill press t-quick inline-flex min-h-11 items-center gap-2 rounded-full border border-line px-3 text-[14px] font-medium', onclick: () => { chosen = chosen.filter((x) => x !== p); paintChosen(); find(); } }, p.name, el('span', { 'aria-hidden': 'true' }, '×')))));
      }
      async function find() {
        if (chosen.length >= MAX_PEOPLE) { $(found).replaceChildren(); return; }
        try {
          const { items } = await api(`/document-works/people?q=${encodeURIComponent($(search).value.trim())}`);
          const left = items.filter((p) => !chosen.some((c) => c.id === p.id)).slice(0, 5);
          $(found).replaceChildren(...left.map((p) => el('li', {}, el('button', {
            type: 'button', class: 'hover-fill press t-quick flex min-h-11 w-full items-center rounded-xl px-3 text-left text-[14px] font-medium [overflow-wrap:anywhere]',
            onclick: () => { chosen.push(p); $(search).value = ''; paintChosen(); find(); $(search).focus(); },
          }, p.name))));
        } catch (err) { onError(err.message); }
      }
      $(search).addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(find, 250); });
      return {
        set(people) { chosen = [...people]; $(search).value = ''; paintChosen(); find(); },
        ids: () => chosen.map((p) => p.id),
      };
    }

    // ---- The document form: a new งาน with its first document, one more in a งาน, or the details of one ----
    function clearErrors() {
      document.querySelectorAll('#docForm [data-err]').forEach((x) => { x.hidden = true; x.textContent = ''; });
      document.querySelectorAll('#docForm [aria-invalid]').forEach((x) => x.removeAttribute('aria-invalid'));
    }
    function showError(key, text) {
      const box = $(`#docForm [data-err="${key}"]`);
      box.textContent = text;
      box.hidden = false;
    }
    const showUnit = () => { $('#unitBox').hidden = $('#fCategory').value !== 'unit_order'; };
    function openForm(mode, d = null) {
      state.mode = mode;
      state.doc = d;
      clearErrors();
      $('#docForm').reset();
      $('#formTitle').textContent = { new: 'เพิ่มงาน', add: 'เพิ่มเอกสารในงานนี้', edit: 'แก้ไขข้อมูลเอกสาร' }[mode];
      $('#formWork').textContent = mode === 'new' ? '' : state.work.title;
      $('#formWork').hidden = mode === 'new';
      $('#workBox').hidden = mode !== 'new';
      $('#fileBox').hidden = mode === 'edit';
      $('#levelBox').hidden = mode === 'edit' && !state.admin && d.ownerId !== state.me;
      $('#formSave').textContent = mode === 'edit' ? 'บันทึก' : 'อัปโหลด';
      if (mode === 'new') state.who.set([]);
      if (d) {
        $('#fTitle').value = d.title;
        $('#fCategory').value = d.category;
        $('#fUnit').value = d.unitName || '';
        $('#fTags').value = d.tags.join(', ');
        $(`[name="level"][value="${d.accessLevel}"]`).checked = true;
      }
      showUnit();
      $('#formDlg').showModal();
    }
    async function save(ev) {
      ev.preventDefault();
      clearErrors();
      const btn = $('#formSave'), label = btn.textContent, { mode, doc } = state;
      btn.disabled = true;
      if (mode !== 'edit') btn.textContent = 'กำลังอัปโหลด...';
      const data = { title: $('#fTitle').value, category: $('#fCategory').value, unitName: $('#fUnit').value, tags: $('#fTags').value.split(',').map((t) => t.trim()).filter(Boolean) };
      if (!$('#levelBox').hidden) data.accessLevel = $('[name="level"]:checked').value;
      if (mode === 'new') Object.assign(data, { workTitle: $('#fWork').value, peopleIds: state.who.ids() });
      if (mode === 'add') data.workId = state.work.id;
      try {
        const { document: saved } = mode === 'edit' ? await api(`/documents/${doc.id}`, { method: 'PUT', body: data }) : await sendFile('/documents', data, $('#fFile').files[0]);
        $('#formDlg').close();
        toast({ new: 'เพิ่มงานแล้ว', add: 'เพิ่มเอกสารแล้ว', edit: 'บันทึกการแก้ไขแล้ว' }[mode]);
        await load();
        await openWork(saved.workId);
      } catch (err) {
        // The server stops at the first group of problems: name what else is missing along with them
        const missing = {};
        if (err.details && mode !== 'edit' && !$('#fFile').files[0]) missing.file = 'เลือกไฟล์เอกสาร';
        if (err.details && mode === 'new' && !$('#fWork').value.trim()) missing.workTitle = 'กรอกชื่องาน';
        const d = { ...missing, ...err.details };
        for (const [k, msg] of Object.entries(d)) {
          if ($(`#docForm [data-err="${k}"]`)) showError(k, msg);
          if (FIELDS[k]) $(FIELDS[k]).setAttribute('aria-invalid', 'true');
        }
        Object.values(FIELDS).map((s) => $(s)).find((n) => n.getAttribute('aria-invalid') === 'true' && n.offsetParent)?.focus();
        if (!Object.keys(d).length) showError('form', err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = label;
      }
    }

    // ---- One งาน ----
    function docRow(d) {
      return el('li', { class: 'flex flex-wrap items-center gap-3 rounded-2xl border border-line p-2' },
        cover(d, 'h-[84px] w-[64px] shrink-0 rounded-xl'),
        el('div', { class: 'min-w-0 flex-1 basis-[180px]' },
          el('p', { class: 'font-display text-[15px] font-semibold [overflow-wrap:anywhere]' }, d.title),
          el('p', { class: 'text-[14px] text-ink2 [overflow-wrap:anywhere]' }, categoryOf(d)),
          el('p', { class: 'text-[14px] text-ink2 [overflow-wrap:anywhere]' }, `${d.fileName} · ${bytes(d.size)} · เวอร์ชัน ${d.version}`),
          d.accessLevel === 'private' || d.archivedAt ? el('p', { class: 'flex flex-wrap gap-1.5 pt-1' }, d.accessLevel === 'private' ? personal() : null, d.archivedAt ? shelved() : null) : null),
        el('div', { class: 'flex gap-1' },
          el('a', { href: fileUrl(d), 'aria-label': `ดาวน์โหลด ${d.title}`, class: 'hover-fill press t-quick inline-flex h-11 items-center rounded-2xl border border-line px-4 font-display text-[15px] font-medium' }, 'ดาวน์โหลด'),
          el('button', { type: 'button', 'aria-label': `จัดการ ${d.title}`, class: 'press t-quick h-11 rounded-2xl px-3 font-display text-[15px] font-medium hover:-translate-y-0.5', onclick: () => openDoc(d.id) }, 'จัดการ')));
    }
    async function openWork(id) {
      try {
        const { work } = await api(`/document-works/${id}`);
        state.work = work;
        $('#workTitle').textContent = work.title;
        $('#workMeta').textContent = `${work.documents.length} เอกสาร · แก้ไขล่าสุด ${dayTime(work.updatedAt)}`;
        $('#workPeople').replaceChildren(...work.people.map((p) => chip(p.name)));
        $('#workDocs').replaceChildren(...work.documents.map(docRow));
        if (!$('#workDlg').open) $('#workDlg').showModal();
      } catch (err) { toast(err.message, true); }
    }
    function openEdit() {
      $('#workDlg').close();
      $('#eWork').value = state.work.title;
      $('#editErr').hidden = true;
      state.editWho.set(state.work.people);
      $('#editDlg').showModal();
    }
    async function saveWork(ev) {
      ev.preventDefault();
      const btn = $('#editSave');
      btn.disabled = true;
      $('#editErr').hidden = true;
      try {
        await api(`/document-works/${state.work.id}`, { method: 'PUT', body: { workTitle: $('#eWork').value, peopleIds: state.editWho.ids() } });
        $('#editDlg').close();
        toast('บันทึกงานแล้ว');
        await load();
        await openWork(state.work.id);
      } catch (err) {
        $('#editErr').textContent = Object.values(err.details || {})[0] || err.message;
        $('#editErr').hidden = false;
      } finally { btn.disabled = false; }
    }

    // ---- One document ----
    async function openDoc(id) {
      try {
        const { document: d } = await api(`/documents/${id}`);
        state.doc = d;
        $('#workDlg').close();
        $('#viewTitle').textContent = d.title;
        $('#viewMeta').textContent = `${categoryOf(d)} · แก้ไขล่าสุด ${dayTime(d.updatedAt)}`;
        $('#viewTags').replaceChildren(...(d.accessLevel === 'private' ? [personal()] : []), ...d.tags.map(chip));
        $('#viewVersions').replaceChildren(...d.versions.map((v) => el('li', { class: 'flex flex-wrap items-center gap-x-3 gap-y-1 border-b border-line py-2 last:border-b-0' },
          el('div', { class: 'min-w-0 flex-1 basis-[220px]' },
            el('p', { class: 'text-[15px] font-medium [overflow-wrap:anywhere]' }, `เวอร์ชัน ${v.version}${v.version === d.version ? ' (ปัจจุบัน)' : ''} · ${v.fileName}`),
            el('p', { class: 'text-[14px] text-ink2 [overflow-wrap:anywhere]' }, `${bytes(v.size)} · ${dayTime(v.createdAt)}${v.uploader ? ` · ${v.uploader}` : ''}`)),
          el('a', { href: `/api/documents/${d.id}/file?version=${v.version}`, 'aria-label': `ดาวน์โหลดเวอร์ชัน ${v.version}`, class: 'hover-fill press t-quick inline-flex h-11 items-center rounded-2xl border border-line px-4 font-display text-[15px] font-medium' }, 'ดาวน์โหลด'))));
        const archived = !!d.archivedAt;
        $('#viewEdit').hidden = archived;
        $('#viewVersion').hidden = archived;
        $('#viewArchive').hidden = archived;
        $('#viewRestore').hidden = !archived;
        if (!$('#viewDlg').open) $('#viewDlg').showModal();
      } catch (err) { toast(err.message, true); }
    }
    function openNext() {
      $('#viewDlg').close();
      $('#nextName').textContent = state.doc.title;
      $('#nextForm').reset();
      $('#nextErr').hidden = true;
      $('#nextDlg').showModal();
    }
    async function sendNext(ev) {
      ev.preventDefault();
      const file = $('#fNext').files[0], btn = $('#nextGo');
      const fail = (text) => { $('#nextErr').textContent = text; $('#nextErr').hidden = false; };
      if (!file) { fail('เลือกไฟล์เอกสาร'); $('#fNext').focus(); return; }
      btn.disabled = true;
      btn.textContent = 'กำลังอัปโหลด...';
      $('#nextErr').hidden = true;
      try {
        await sendFile(`/documents/${state.doc.id}/versions`, {}, file);
        $('#nextDlg').close();
        toast('เพิ่มเวอร์ชันใหม่แล้ว');
        await load();
        await openWork(state.work.id);
      } catch (err) { fail(err.details?.file || err.message); } finally {
        btn.disabled = false;
        btn.textContent = 'อัปโหลด';
      }
    }
    function openOff() {
      $('#viewDlg').close();
      $('#offName').textContent = state.doc.title;
      $('#offErr').hidden = true;
      $('#offDlg').showModal();
    }
    async function archive() {
      const btn = $('#offGo');
      btn.disabled = true;
      try {
        await api(`/documents/${state.doc.id}/archive`, { method: 'POST', body: {} });
        $('#offDlg').close();
        toast('เก็บเอกสารเข้าคลังแล้ว');
        await load();
        await openWork(state.work.id);
      } catch (err) {
        $('#offErr').textContent = err.message;
        $('#offErr').hidden = false;
      } finally { btn.disabled = false; }
    }
    async function restore() {
      const btn = $('#viewRestore');
      btn.disabled = true;
      try {
        await api(`/documents/${state.doc.id}/restore`, { method: 'POST', body: {} });
        $('#viewDlg').close();
        toast('นำเอกสารออกจากคลังแล้ว');
        await load();
        await openWork(state.work.id);
      } catch (err) { toast(err.message, true); } finally { btn.disabled = false; }
    }

    // ---- Start ----
    (async () => {
      const user = await DESK.start({ page: 'documents', allow: ['pr', 'admin'] });
      if (!user) return;
      state.admin = user.role === 'admin';
      state.me = user.id;
      const options = Object.entries(CATEGORIES).map(([k, l]) => el('option', { value: k }, l));
      $('#fCategory').replaceChildren(el('option', { value: '' }, 'เลือกหมวดเอกสาร'), ...options);
      $('#filter').replaceChildren(el('option', { value: '' }, 'ทุกหมวด'), ...options.map((o) => o.cloneNode(true)));
      $('#units').replaceChildren(...[...new Set([...ORG.staffGroups.flatMap((g) => g.units), ...Object.keys(ORG.faculties)])].map((u) => el('option', { value: u })));
      state.who = picker({ list: '#chosen', search: '#fWho', found: '#whoList', onError: (text) => showError('people', text) });
      state.editWho = picker({ list: '#eChosen', search: '#eWho', found: '#eList', onError: (text) => { $('#editErr').textContent = text; $('#editErr').hidden = false; } });
      $('#app').hidden = false;

      let wait;
      $('#search').addEventListener('input', () => { clearTimeout(wait); wait = setTimeout(load, 250); });
      $('#filter').addEventListener('change', load);
      document.querySelectorAll('[data-shelf]').forEach((b) => b.addEventListener('click', () => { state.shelf = b.dataset.shelf; load(); }));
      $('#add').addEventListener('click', () => openForm('new'));
      $('#docForm').addEventListener('submit', save);
      $('#fCategory').addEventListener('change', showUnit);
      $('#formClose').addEventListener('click', () => $('#formDlg').close());
      $('#workClose').addEventListener('click', () => $('#workDlg').close());
      $('#workEdit').addEventListener('click', openEdit);
      $('#workAdd').addEventListener('click', () => { $('#workDlg').close(); openForm('add'); });
      $('#editForm').addEventListener('submit', saveWork);
      $('#editClose').addEventListener('click', () => $('#editDlg').close());
      $('#viewClose').addEventListener('click', () => { $('#viewDlg').close(); openWork(state.work.id); });
      $('#viewEdit').addEventListener('click', () => { $('#viewDlg').close(); openForm('edit', state.doc); });
      $('#viewVersion').addEventListener('click', openNext);
      $('#viewArchive').addEventListener('click', openOff);
      $('#viewRestore').addEventListener('click', restore);
      $('#nextForm').addEventListener('submit', sendNext);
      $('#nextClose').addEventListener('click', () => $('#nextDlg').close());
      $('#offClose').addEventListener('click', () => $('#offDlg').close());
      $('#offGo').addEventListener('click', archive);
      await load();
    })();
  </script>
</body>
</html>
