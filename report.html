<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รายงาน | หลังบ้าน ข่าว มรส.</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/img/icon-180.png">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.classList.toggle('dark', t === 'dark');
      document.documentElement.classList.add('js');
    })();
  </script>
  <link rel="preload" href="/assets/fonts/NotoSansThai.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/Kanit-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="desk.css">
  <style>
    .seg button[aria-pressed="true"] { background: var(--grad); color: #fff; box-shadow: var(--shadow-glow); }
    .kpi-num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .heat td.cell { font-variant-numeric: tabular-nums; }
    .heat td.cell span { display: grid; place-items: center; height: 34px; min-width: 44px; border-radius: 10px; font-family: Kanit, sans-serif; font-weight: 600; font-size: 14px; }
    .bar { transform-origin: bottom; animation: grow .6s var(--spring) both; }
    .hbar { transform-origin: left; animation: growX .6s var(--spring) both; }
    @keyframes grow { from { transform: scaleY(0); } }
    @keyframes growX { from { transform: scaleX(0); } }
    .tip { position: relative; }
    .tip:hover::after, .tip:focus-visible::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); white-space: nowrap;
      background: rgb(var(--ink)); color: rgb(var(--shell)); font-size: 12px; padding: 4px 8px; border-radius: 8px; z-index: 5; pointer-events: none; }
    @media print { #side, #mbar, #controls button { display: none !important; } body.app { height: auto; overflow: visible; } }
  </style>
  <script src="thai-date.js" defer></script>
  <link rel="stylesheet" href="/assets/app.css?v=f171df7425">
</head>
<body class="app">
  <a href="#report" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[80] rounded-xl bg-royal px-4 py-2 text-white dark:text-bg">ข้ามไปที่รายงาน</a>
  <div class="flex min-h-dvh flex-col lg:h-dvh lg:flex-row">
    <header id="mbar" class="sticky top-0 z-40 flex items-center gap-3 border-b border-line bg-shell/95 px-4 py-2.5 shadow-raised backdrop-blur-xl lg:hidden"></header>
    <div id="scrim" class="fixed inset-0 z-40 bg-[rgb(10_11_32/.45)] lg:hidden" aria-hidden="true"></div>
    <aside id="side" class="scroll-thin fixed inset-y-0 left-0 z-50 flex w-[272px] flex-col overflow-y-auto bg-bg px-4 pb-4 pt-5 shadow-float lg:static lg:z-auto lg:w-[248px] lg:shrink-0 lg:bg-transparent lg:shadow-none" aria-label="เมนูหลังบ้าน"></aside>

    <main id="main" class="flex min-h-0 min-w-0 flex-1 flex-col p-2 sm:p-3 lg:pl-0">
      <section id="gate" class="m-auto flex max-w-[520px] flex-col items-center gap-4 rounded-card border border-line bg-shell p-8 text-center shadow-float" hidden></section>

      <div id="app" class="flex min-h-0 flex-1 flex-col gap-3" hidden>
        <!-- Controls -->
        <section id="controls" class="rounded-card bg-shell p-4 shadow-raised sm:px-5" aria-labelledby="pageTitle">
          <div class="flex flex-wrap items-center gap-x-4 gap-y-3">
            <div class="mr-auto min-w-0">
              <h1 id="pageTitle" class="font-display tight text-[26px] font-bold text-royal">รายงาน</h1>
              <p id="scopeText" class="text-[13px] text-ink2"></p>
            </div>
            <button id="xlsx" type="button" class="press t-spring inline-flex h-11 items-center gap-2 rounded-2xl bg-royal px-5 font-display text-[15px] font-semibold text-white dark:text-bg shadow-raised hover:-translate-y-0.5">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13l4 5M12 13l-4 5"/></svg>
              ส่งออก Excel
            </button>
            <button type="button" disabled aria-describedby="pdfNote" class="inline-flex h-11 cursor-not-allowed items-center gap-2 rounded-2xl border border-dashed border-line px-4 font-display text-[15px] font-medium text-ink2">PDF</button>
            <span id="pdfNote" class="sr-only">ส่งออก PDF เปิดใช้หลังเปิดระบบ</span>
          </div>
          <div class="mt-3 flex flex-wrap items-end gap-3">
            <div class="seg inline-flex rounded-full border border-line bg-surface2 p-1" role="group" aria-label="เลือกช่วงเวลา">
              <button type="button" data-mode="month" class="press t-quick h-9 rounded-full px-4 font-display text-[14px] font-semibold">เดือน</button>
              <button type="button" data-mode="quarter" class="press t-quick h-9 rounded-full px-4 font-display text-[14px] font-semibold">ไตรมาส</button>
              <button type="button" data-mode="fy" class="press t-quick h-9 rounded-full px-4 font-display text-[14px] font-semibold">ปีงบประมาณ</button>
              <button type="button" data-mode="custom" class="press t-quick h-9 rounded-full px-4 font-display text-[14px] font-semibold">กำหนดเอง</button>
            </div>
            <label id="pickBox" class="grid gap-1"><span class="sr-only">ช่วงที่เลือก</span>
              <select id="pick" class="field sel h-11 min-w-[200px] rounded-2xl pl-4 pr-10 text-[15px]"></select>
            </label>
            <div id="customBox" class="flex flex-wrap items-center gap-2" hidden>
              <label class="flex items-center gap-2 text-[14px]">ตั้งแต่ <input id="from" type="date" class="field h-11 rounded-2xl px-3 text-[15px]"></label>
              <label class="flex items-center gap-2 text-[14px]">ถึง <input id="to" type="date" class="field h-11 rounded-2xl px-3 text-[15px]"></label>
            </div>
            <label id="unitBox" class="grid min-w-[240px] flex-1 gap-1 sm:max-w-[360px]" hidden>
              <span class="sr-only">หน่วยงาน</span>
              <input id="unit" list="units" autocomplete="off" placeholder="ทุกหน่วยงาน (พิมพ์เพื่อเลือก)" class="field h-11 rounded-2xl px-4 text-[15px]">
              <datalist id="units"></datalist>
            </label>
          </div>
        </section>

        <div id="report" class="scroll-thin grid min-h-0 flex-1 content-start gap-3 overflow-y-auto pb-2" aria-live="polite" aria-busy="true"></div>
      </div>
    </main>
  </div>

  <script>window.SERVER_AUTH = true;</script>
  <script src="auth.js"></script>
  <script src="org-data.js"></script>
  <script src="desk.js"></script>
  <script>
    const { esc, day, isoDay, num, toast } = DESK;
    const $ = (s) => document.querySelector(s);
    const KIND = { news: 'ข่าวพร้อมภาพ', video: 'วิดีโอ', banner: 'แบนเนอร์' };
    const SOURCE = { facebook: 'Facebook', direct: 'เปิดลิงก์ตรง', search: 'เครื่องมือค้นหา', line: 'LINE', internal: 'ในเว็บข่าว มรส.', other: 'เว็บอื่น ๆ' };
    const DEVICE = { mobile: 'มือถือ', desktop: 'คอมพิวเตอร์', tablet: 'แท็บเล็ต' };
    const MONTH = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
    const MONTH_LONG = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
    const pad = (n) => String(n).padStart(2, '0');
    const lastDay = (y, m) => new Date(y, m, 0).getDate(); // m = 1..12
    const today = isoDay();
    const [TY, TM] = today.split('-').map(Number);
    const hours = (h) => (h == null ? '—' : h < 48 ? `${h} ชม.` : `${Math.round(h / 24)} วัน`);
    let me, mode = 'month', kindFilter = 'all', last = null;

    // ---- Periods ----
    // Thai fiscal year N (พ.ศ.) runs 1 Oct (N−1) to 30 Sep N. Quarters: Oct–Dec, Jan–Mar, Apr–Jun, Jul–Sep.
    const fyOf = (y, m) => (m >= 10 ? y + 1 : y) + 543;
    function options() {
      if (mode === 'month') {
        return Array.from({ length: 24 }, (_, i) => {
          const d = new Date(TY, TM - 1 - i, 1), y = d.getFullYear(), m = d.getMonth() + 1;
          return { label: `${MONTH_LONG[m - 1]} ${y + 543}`, from: `${y}-${pad(m)}-01`, to: `${y}-${pad(m)}-${pad(lastDay(y, m))}` };
        });
      }
      if (mode === 'quarter') {
        const out = [];
        let fy = fyOf(TY, TM), q = TM >= 10 ? 1 : Math.ceil(TM / 3) + 1;
        for (let i = 0; i < 8; i++) {
          const startM = [10, 1, 4, 7][q - 1], y = (q === 1 ? fy - 1 : fy) - 543;
          out.push({ label: `ไตรมาส ${q} ปีงบประมาณ ${fy} (${MONTH[startM - 1]}–${MONTH[startM + 1]})`, from: `${y}-${pad(startM)}-01`, to: `${y}-${pad(startM + 2)}-${pad(lastDay(y, startM + 2))}` });
          if (--q === 0) { q = 4; fy--; }
        }
        return out;
      }
      if (mode === 'fy') {
        const fy = fyOf(TY, TM);
        return Array.from({ length: 4 }, (_, i) => ({ label: `ปีงบประมาณ ${fy - i}`, from: `${fy - i - 544}-10-01`, to: `${fy - i - 543}-09-30` }));
      }
      return [];
    }
    function range() {
      if (mode === 'custom') return { from: $('#from').value, to: $('#to').value };
      const o = options()[Number($('#pick').value) || 0];
      return { from: o.from, to: o.to > today ? today : o.to, label: o.label };
    }
    function setMode(m) {
      mode = m;
      document.querySelectorAll('.seg [data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
      $('#pickBox').hidden = m === 'custom';
      $('#customBox').hidden = m !== 'custom';
      if (m !== 'custom') $('#pick').innerHTML = options().map((o, i) => `<option value="${i}">${o.label}</option>`).join('');
      else if (!$('#from').value) { $('#from').value = `${TY}-${pad(TM)}-01`; $('#to').value = today; }
      load();
    }
    const query = () => {
      const r = range();
      const p = new URLSearchParams({ from: r.from, to: r.to });
      const unit = $('#unit').value.trim();
      if (unit && me.role !== 'coordinator') p.set('unit', unit);
      return p;
    };

    // ---- Rendering ----
    const card = (inner, cls = '') => `<section class="rounded-card bg-shell p-4 shadow-raised sm:p-5 ${cls}">${inner}</section>`;
    function kpi(label, value, note, tone) {
      return `<div class="rounded-card bg-shell p-4 shadow-raised sm:p-5">
        <p class="text-[13px] font-medium text-ink2">${label}</p>
        <p class="kpi-num mt-1 font-display text-[34px] font-bold leading-none ${tone}">${value}</p>
        <p class="mt-2 text-[13px] text-ink2">${note}</p></div>`;
    }
    function bars(rows, labels, total, color) {
      return `<ul class="grid gap-2.5">${Object.keys(labels).map((k, i) => {
        const n = rows[k] || 0, pct = total ? Math.round((n / total) * 100) : 0;
        return `<li><div class="flex justify-between text-[14px]"><span>${labels[k]}</span><span class="font-display font-semibold">${num(n)} <span class="font-sans text-[12px] font-normal text-ink2">${pct}%</span></span></div>
          <div class="mt-1 h-2.5 overflow-hidden rounded-full bg-surface2"><div class="hbar h-full rounded-full ${color}" style="width:${pct}%; animation-delay:${i * 60}ms"></div></div></li>`;
      }).join('')}</ul>`;
    }
    function daily(byDay, from, to) {
      const map = Object.fromEntries(byDay.map((d) => [d.day, d.n]));
      const days = [];
      for (let d = new Date(from + 'T00:00:00Z'); d <= new Date(to + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + 1)) days.push(d.toISOString().slice(0, 10));
      // Long ranges: weekly or monthly sums so the bars stay readable
      let buckets = days.map((d) => ({ key: d, label: `${Number(d.slice(8))} ${MONTH[Number(d.slice(5, 7)) - 1]}`, n: map[d] || 0 }));
      if (days.length > 93) {
        const by = {};
        days.forEach((d) => { const k = d.slice(0, 7); by[k] = (by[k] || 0) + (map[d] || 0); });
        buckets = Object.entries(by).map(([k, n]) => ({ key: k, label: `${MONTH[Number(k.slice(5)) - 1]} ${String(Number(k.slice(0, 4)) + 543).slice(2)}`, n }));
      } else if (days.length > 45) {
        buckets = [];
        for (let i = 0; i < days.length; i += 7) {
          const w = days.slice(i, i + 7);
          buckets.push({ key: w[0], label: `สัปดาห์ ${Number(w[0].slice(8))} ${MONTH[Number(w[0].slice(5, 7)) - 1]}`, n: w.reduce((a, d) => a + (map[d] || 0), 0) });
        }
      }
      const max = Math.max(1, ...buckets.map((b) => b.n));
      return `<div class="flex h-[250px] items-end gap-[3px]" role="img" aria-label="ยอดอ่านตามช่วงเวลา สูงสุด ${num(max)} ครั้ง">
        ${buckets.map((b, i) => `<span class="tip flex h-full flex-1 items-end" tabindex="0" data-tip="${b.label}: ${num(b.n)}">
          <span class="bar block w-full rounded-t-md bg-grad" style="height:${Math.max(2, (b.n / max) * 100)}%; animation-delay:${Math.min(i * 12, 400)}ms; opacity:${b.n ? 1 : .25}"></span></span>`).join('')}
      </div>
      <div class="mt-2 flex justify-between text-[12px] text-ink2"><span>${buckets[0]?.label || ''}</span><span>${buckets.at(-1)?.label || ''}</span></div>`;
    }
    function heat(matrix, from, to) {
      const months = [];
      for (let d = new Date(from.slice(0, 7) + '-01T00:00:00Z'); d <= new Date(to + 'T00:00:00Z'); d.setUTCMonth(d.getUTCMonth() + 1)) months.push(d.toISOString().slice(0, 7));
      const rows = new Map();
      for (const m of matrix) {
        if (kindFilter !== 'all' && m.kind !== kindFilter) continue;
        if (!rows.has(m.unit)) rows.set(m.unit, { total: 0, imported: 0, kinds: {} });
        const r = rows.get(m.unit);
        r[m.month] = (r[m.month] || 0) + m.n;
        r.kinds[m.month] = { ...(r.kinds[m.month] || {}), [m.kind]: m.n };
        r.total += m.n;
        r.imported += m.imported;
      }
      const sorted = [...rows.entries()].sort((a, b) => b[1].total - a[1].total);
      const max = Math.max(1, ...sorted.flatMap(([, r]) => months.map((m) => r[m] || 0)));
      const colTotals = months.map((m) => sorted.reduce((a, [, r]) => a + (r[m] || 0), 0));
      const cell = (n, kinds) => {
        const a = n ? 0.14 + (n / max) * 0.86 : 0;
        const tip = n ? Object.entries(kinds || {}).map(([k, v]) => `${KIND[k]} ${v}`).join(', ') : 'ไม่มีข่าว';
        return `<td class="cell w-[52px] px-0.5 py-0.5"><span class="tip" tabindex="0" data-tip="${tip}" style="background: rgb(var(--purple) / ${a.toFixed(2)}); color: ${a > .55 ? '#fff' : 'rgb(var(--ink))'}">${n || '·'}</span></td>`;
      };
      const chips = [['all', 'ทุกประเภท'], ...Object.entries(KIND)].map(([k, l]) => `<button type="button" data-kind="${k}" aria-pressed="${k === kindFilter}" class="press t-quick h-9 rounded-full px-4 font-display text-[14px] font-semibold">${l}</button>`).join('');
      return `<div class="flex flex-wrap items-center justify-between gap-3">
          <div><h2 class="font-display text-[19px] font-semibold">จำนวนข่าวตามหน่วยงานและเดือน</h2>
          <p class="text-[13px] text-ink2">สีเข้มคือเดือนที่เผยแพร่มาก ชี้ที่ช่องเพื่อดูแยกตามประเภท ข่าวนำเข้าย้อนหลังนับตามวันที่เดิม</p></div>
          <div class="seg inline-flex flex-wrap rounded-full border border-line bg-surface2 p-1" role="group" aria-label="ประเภทเนื้อหา">${chips}</div>
        </div>
        ${sorted.length ? `<div class="scroll-thin mt-4 overflow-x-auto"><table class="heat w-full border-separate border-spacing-0 text-left text-[14px]">
          <thead><tr class="text-[12px] text-ink2"><th class="sticky left-0 z-[1] bg-shell py-2 pr-3 font-medium">หน่วยงาน</th>
            ${months.map((m) => `<th class="w-[52px] px-0.5 py-2 text-center font-medium">${MONTH[Number(m.slice(5)) - 1]}<br>${String(Number(m.slice(0, 4)) + 543).slice(2)}</th>`).join('')}
            <th class="w-[64px] py-2 pl-3 text-right font-medium">รวม</th></tr></thead>
          <tbody>${sorted.map(([unit, r]) => `<tr>
            <th class="sticky left-0 z-[1] max-w-[260px] truncate bg-shell py-0.5 pr-3 font-medium" title="${esc(unit)}">${esc(unit)}${r.imported ? ` <span class="text-[12px] font-normal text-gold">(นำเข้า ${r.imported})</span>` : ''}</th>
            ${months.map((m) => cell(r[m] || 0, r.kinds[m])).join('')}
            <td class="py-0.5 pl-3 text-right font-display text-[15px] font-semibold">${r.total}</td></tr>`).join('')}</tbody>
          <tfoot><tr class="text-ink2"><th class="sticky left-0 bg-shell pt-2 pr-3 text-[13px] font-medium">รวมทุกหน่วยงาน</th>
            ${colTotals.map((n) => `<td class="pt-2 text-center font-display text-[14px] font-semibold">${n}</td>`).join('')}
            <td class="pt-2 pl-3 text-right font-display text-[15px] font-bold text-ink">${colTotals.reduce((a, b) => a + b, 0)}</td></tr></tfoot>
        </table></div>` : '<p class="mt-4 rounded-2xl border border-dashed border-line p-8 text-center text-ink2">ไม่มีข่าวที่เผยแพร่ในช่วงนี้</p>'}`;
    }
    function render(r) {
      const a = r.approval, reads = r.reads;
      const st = { review: 'รอ PR ตรวจ', writing: 'PR กำลังเขียนข่าว' };
      $('#report').innerHTML = `
        <div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
          ${kpi('ข่าวที่เผยแพร่', num(r.totals.stories), `${num(r.totals.units)} หน่วยงาน${r.totals.imported ? `, นำเข้าย้อนหลัง ${num(r.totals.imported)}` : ''}`, 'text-royal')}
          ${kpi('ยอดอ่าน', num(r.totals.reads), 'นับ 1 ครั้งต่อผู้อ่านต่อข่าวต่อวัน ไม่นับบอท', 'text-purple')}
          ${kpi('ค้างตรวจ', num(a.review), a.late ? `<span class="font-semibold text-brand">เกินเวลาตรวจ ${a.reviewDays} วันทำการ ${a.late} งาน</span>` : `ไม่มีงานเกินเวลาตรวจ ${a.reviewDays} วันทำการ`, a.late ? 'text-brand' : 'text-ink')}
          ${kpi('เวลาเฉลี่ยถึงเผยแพร่', hours(a.avgHours), a.medianHours != null ? `ครึ่งหนึ่งเผยแพร่ภายใน ${hours(a.medianHours)}` : 'ยังไม่มีงานที่เผยแพร่ในช่วงนี้', 'text-ink')}
        </div>
        <div class="grid gap-3 xl:grid-cols-[minmax(0,1fr)_380px]">
          ${card(`<div class="flex items-baseline justify-between gap-2"><h2 class="font-display text-[19px] font-semibold">ยอดอ่าน</h2><span class="text-[13px] text-ink2">${day(r.range.from)} – ${day(r.range.to)}</span></div>
            <div class="mt-4">${daily(reads.byDay, r.range.from, r.range.to)}</div>`)}
          ${card(`<h2 class="font-display text-[19px] font-semibold">สถานะการอนุมัติ</h2>
            <p class="text-[13px] text-ink2">คิวตอนนี้ และผลการตรวจในช่วงที่เลือก</p>
            <dl class="mt-3 grid grid-cols-3 gap-2 text-center">
              <div class="rounded-2xl bg-sky-soft p-3"><dt class="text-[12px] text-ink2">ค้างตรวจ</dt><dd class="font-display text-[24px] font-bold text-sky">${a.review}</dd></div>
              <div class="rounded-2xl bg-purple-soft p-3"><dt class="text-[12px] text-ink2">PR กำลังเขียน</dt><dd class="font-display text-[24px] font-bold text-purple">${a.writing}</dd></div>
              <div class="rounded-2xl bg-gold-soft p-3"><dt class="text-[12px] text-ink2">รอเอกสาร</dt><dd class="font-display text-[24px] font-bold text-gold">${a.revise}</dd></div>
            </dl>
            <dl class="mt-3 grid gap-2 text-[14px]">
              <div class="flex justify-between gap-2"><dt class="text-ink2">เผยแพร่ในช่วงนี้</dt><dd class="font-display font-semibold">${a.published} งาน</dd></div>
              <div class="flex justify-between gap-2"><dt class="text-ink2">ไม่เผยแพร่</dt><dd class="font-display font-semibold">${a.rejected} งาน</dd></div>
              <div class="flex justify-between gap-2"><dt class="text-ink2">เวลาเฉลี่ยตั้งแต่ส่งถึงเผยแพร่</dt><dd class="font-display font-semibold">${hours(a.avgHours)}</dd></div>
            </dl>
            <div class="mt-3 rounded-2xl border ${a.oldest && a.oldest.workDays > a.reviewDays ? 'border-[rgb(var(--red)/.45)] bg-red-soft/60' : 'border-line bg-surface2/60'} p-3">
              <p class="text-[12px] font-medium text-ink2">อายุคิวสูงสุด</p>
              ${a.oldest ? `<p class="font-display text-[20px] font-bold ${a.oldest.workDays > a.reviewDays ? 'text-brand' : ''}">${hours(a.oldest.ageHours)} <span class="font-sans text-[13px] font-normal text-ink2">(${a.oldest.workDays} วันทำการ)</span></p>
                <p class="clamp-2 text-[13px]">${esc(a.oldest.ref)} ${esc(a.oldest.title)}</p><p class="text-[12px] text-ink2">${esc(a.oldest.unit)}, ${st[a.oldest.status]}</p>` : '<p class="font-display text-[16px] font-semibold">ไม่มีงานค้าง</p>'}
            </div>`)}
        </div>
        ${card(heat(r.matrix, r.range.from, r.range.to), 'min-w-0')}
        <div class="grid gap-3 xl:grid-cols-[minmax(0,1fr)_380px]">
          ${card(`<h2 class="font-display text-[19px] font-semibold">ยอดอ่าน 10 อันดับ</h2>
            ${reads.top.length ? `<ol class="mt-3 grid gap-1">${reads.top.map((t, i) => `
              <li class="grid grid-cols-[32px_minmax(0,1fr)_auto] items-center gap-3 rounded-2xl px-2 py-1.5 ${i < 3 ? 'bg-surface2/70' : ''}">
                <span class="grid h-8 w-8 place-items-center rounded-full font-display text-[15px] font-bold ${i < 3 ? 'bg-grad text-white' : 'text-ink2'}">${i + 1}</span>
                <span class="min-w-0"><a href="news.html?id=${t.id}" target="_blank" rel="noopener" class="block truncate font-display text-[15px] font-medium hover:underline">${esc(t.title)}</a>
                  <span class="block truncate text-[12px] text-ink2">${esc(t.unit)}, ${day(t.publishedAt)}${t.imported ? ', นำเข้าย้อนหลัง' : ''}</span></span>
                <span class="font-display text-[15px] font-semibold">${num(t.reads)}</span></li>`).join('')}</ol>` : '<p class="mt-3 text-ink2">ยังไม่มียอดอ่านในช่วงนี้</p>'}`)}
          <div class="grid content-start gap-3">
            ${card(`<h2 class="font-display text-[19px] font-semibold">ผู้อ่านมาจากไหน</h2><div class="mt-3">${bars(reads.sources, SOURCE, r.totals.reads, 'bg-grad')}</div>`)}
            ${card(`<h2 class="font-display text-[19px] font-semibold">อุปกรณ์ที่ใช้อ่าน</h2><div class="mt-3">${bars(reads.devices, DEVICE, r.totals.reads, 'bg-royal')}</div>`)}
          </div>
        </div>`;
      $('#report').setAttribute('aria-busy', 'false');
    }

    let seq = 0;
    async function load() {
      const r0 = range();
      if (!r0.from || !r0.to) return;
      if (r0.from > r0.to) { toast('วันเริ่มต้องไม่หลังวันสิ้นสุด', true); return; }
      const s = ++seq;
      $('#report').classList.add('is-loading');
      try {
        const r = await api('/reports?' + query());
        if (s !== seq) return;
        last = r;
        $('#scopeText').textContent = `${r0.label || `${day(r.range.from)} – ${day(r.range.to)}`} · ${r.unit || 'ทุกหน่วยงาน'}`;
        render(r);
      } catch (err) {
        if (s === seq) $('#report').innerHTML = `<p class="rounded-card bg-shell p-8 text-center text-brand shadow-raised">${esc(err.message)}</p>`;
      } finally {
        if (s === seq) $('#report').classList.remove('is-loading');
      }
    }

    document.querySelectorAll('.seg [data-mode]').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
    $('#pick').addEventListener('change', load);
    $('#from').addEventListener('change', load);
    $('#to').addEventListener('change', load);
    $('#unit').addEventListener('change', load);
    $('#report').addEventListener('click', (e) => { const b = e.target.closest('[data-kind]'); if (b && last) { kindFilter = b.dataset.kind; render(last); } });
    $('#xlsx').addEventListener('click', () => { location.href = '/api/reports/export.xlsx?' + query(); });

    DESK.start({ page: 'report', allow: ['pr', 'admin', 'coordinator'] }).then((user) => {
      if (!user) return;
      me = user;
      $('#app').hidden = false;
      $('#from').max = $('#to').max = today;
      if (user.role === 'coordinator') {
        $('#pageTitle').textContent = `รายงานของ${user.coordUnit}`;
      } else {
        $('#unitBox').hidden = false;
        $('#units').innerHTML = [...new Set([...ORG.staffGroups.flatMap((g) => g.units), ...Object.keys(ORG.faculties)])].map((u) => `<option value="${esc(u)}"></option>`).join('');
      }
      setMode('month');
    });
  </script>
</body>
</html>
