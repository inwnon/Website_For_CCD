  <link rel="apple-touch-icon" href="/assets/img/icon-180.png">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.classList.toggle('dark', t === 'dark');
      document.documentElement.classList.add('js');
    })();
  </script>

  <link rel="preload" href="/assets/fonts/Kanit-700.woff2" as="font" type="font/woff2" crossorigin>

    /* One colour per status, always with its name in words */
    .st-pending { background: rgb(var(--gold-soft)); color: rgb(var(--gold)); }
    .st-approved { background: rgb(var(--royal-soft)); color: rgb(var(--royal)); }
    .st-rejected { background: rgb(var(--red-soft)); color: rgb(var(--red)); }
    .st-cancelled { background: rgb(var(--surface-2)); color: rgb(var(--ink-2)); }
    .seg[aria-pressed="true"] { background: rgb(var(--shell)); color: rgb(var(--ink)); box-shadow: var(--shadow-raised); }

  <script>window.SERVER_AUTH = true;</script>
  <script src="auth.js"></script>
  <script src="arrivals.js"></script>
  <script src="desk.js"></script>
  <script src="event-form.js"></script>
  <script>
    const { toast, dayTime } = DESK;
    const $ = (s) => document.querySelector(s);
    const TYPES = { photo: 'ถ่ายภาพ', video: 'ถ่ายวิดีโอ', news: 'เขียนข่าว', other: 'อื่น ๆ' };
    const STATUS = { pending: 'รอพิจารณา', approved: 'อนุมัติแล้ว', rejected: 'ไม่อนุมัติ', cancelled: 'ยกเลิกแล้ว' };
    const FIELDS = { title: '#fTitle', type: '#fType', location: '#fLocation', startAt: '#fStart', endAt: '#fEnd' };
    const state = { items: [], status: '', asked: 0, open: null, reviews: false, submits: false, who: null };

    // Everything from the server goes in as text nodes, never as HTML
    function el(tag, props = {}, ...kids) {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(props)) {
        if (k === 'class') n.className = v;
        else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
        else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
      }
      n.append(...kids.flat().filter((x) => x != null && x !== false));
      return n;
    }
    const pill = (s) => el('span', { class: `st-${s} inline-flex rounded-full px-3 py-0.5 font-display text-[13px] font-semibold` }, STATUS[s]);

    function row(r) {
      return el('li', { class: 'border-b border-line last:border-b-0' },
        el('button', { type: 'button', class: 'hover-fill press t-quick grid w-full items-center gap-x-4 gap-y-1 rounded-2xl px-2 py-3 text-left sm:grid-cols-[minmax(0,1fr)_auto] sm:px-3', onclick: () => openView(r) },
          el('span', { class: 'grid min-w-0 gap-0.5' },
            el('span', { class: 'font-display text-[16px] font-semibold [overflow-wrap:anywhere]' }, r.title),
            el('span', { class: 'text-[14px] text-ink2 [overflow-wrap:anywhere]' }, `${TYPES[r.type]} · ${dayTime(r.startAt)} · ${r.location}`),
            state.reviews || !state.submits ? el('span', { class: 'text-[14px] text-ink2 [overflow-wrap:anywhere]' }, `ผู้ขอ ${r.requester || 'ไม่ระบุชื่อ'}`) : null),
          el('span', { class: 'justify-self-start sm:justify-self-end' }, pill(r.status))));
    }

    function paint() {
      $('#list').replaceChildren(...state.items.map(row));
      $('#count').textContent = `${state.status ? STATUS[state.status] : 'ทั้งหมด'} ${state.items.length} คำขอ`;
      $('#empty').hidden = state.items.length > 0;
      $('#empty').textContent = state.status ? `ไม่มีคำขอสถานะ${STATUS[state.status]}` : 'ยังไม่มีคำขอใช้บริการ';
      document.querySelectorAll('[data-status]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.status === state.status)));
    }

    // Only the latest choice paints: an older, slower answer is dropped
    async function load() {
      const asked = ++state.asked;
      try {
        const r = await api(`/requests${state.status ? `?status=${state.status}` : ''}`);
        if (asked !== state.asked) return;
        state.items = r.items;
        paint();
      } catch (err) { toast(err.message, true); }
    }

    // ---- New request ----
    function clearErrors() {
      document.querySelectorAll('#reqForm [data-err]').forEach((x) => { x.hidden = true; x.textContent = ''; });
      document.querySelectorAll('#reqForm [aria-invalid]').forEach((x) => x.removeAttribute('aria-invalid'));
    }
    function showError(key, text) {
      const box = $(`#reqForm [data-err="${key}"]`);
      box.textContent = text;
      box.hidden = false;
    }
    function openForm() {
      clearErrors();
      $('#reqForm').reset();
      $('#formDlg').showModal();
    }
    async function save(ev) {
      ev.preventDefault();
      clearErrors();
      const btn = $('#formSave');
      btn.disabled = true;
      const when = (v) => (v ? `${v}:00+07:00` : null);
      const body = { title: $('#fTitle').value, type: $('#fType').value, location: $('#fLocation').value, startAt: when($('#fStart').value), endAt: when($('#fEnd').value), details: $('#fDetails').value };
      try {
        await api('/requests', { method: 'POST', body });
        $('#formDlg').close();
        toast('ส่งคำขอแล้ว ทีม PR จะพิจารณาและแจ้งผลให้ทราบ');
        await load();
        $('#list').focus();
      } catch (err) {
        const d = err.details || {};
        let first = null;
        for (const [k, msg] of Object.entries(d)) {
          if ($(`#reqForm [data-err="${k}"]`)) showError(k, msg);
          if (FIELDS[k]) { $(FIELDS[k]).setAttribute('aria-invalid', 'true'); first ||= $(FIELDS[k]); }
        }
        if (first) first.focus();
        if (!Object.keys(d).length) showError('form', err.message);
      } finally { btn.disabled = false; }
    }

    // ---- One request ----
    function openView(r) {
      state.open = r;
      const fact = (k, v) => [el('dt', { class: 'font-display font-semibold text-ink2' }, k), el('dd', { class: 'mb-1 [overflow-wrap:anywhere] sm:mb-0 whitespace-pre-line' }, v)];
      $('#viewTitle').textContent = r.title;
      $('#viewStatus').replaceChildren(pill(r.status));
      $('#viewFacts').replaceChildren(...[
        fact('ประเภท', TYPES[r.type]), fact('เริ่ม', dayTime(r.startAt)), fact('สิ้นสุด', dayTime(r.endAt)), fact('สถานที่', r.location),
        fact('ผู้ขอ', r.requester || 'ไม่ระบุชื่อ'), fact('ส่งเมื่อ', dayTime(r.createdAt)), r.details ? fact('รายละเอียด', r.details) : [],
      ].flat());
      const decided = r.status === 'approved' || r.status === 'rejected';
      $('#viewDecision').hidden = !decided;
      if (decided) {
        $('#viewDecision').replaceChildren(el('p', { class: 'font-display font-semibold' }, `${STATUS[r.status]}โดย ${r.reviewer || 'ทีม PR'} เมื่อ ${dayTime(r.reviewedAt)}`));
        if (r.reviewNote) $('#viewDecision').append(el('p', { class: '[overflow-wrap:anywhere] whitespace-pre-line' }, `${r.status === 'rejected' ? 'เหตุผล' : 'หมายเหตุ'}: ${r.reviewNote}`));
      }
      $('#viewEvent').hidden = !r.eventId;
      if (r.eventId) $('#viewEvent').href = `calendar.html?id=${r.eventId}`;
      const pending = r.status === 'pending';
      $('#viewCancel').hidden = !(pending && state.submits);
      $('#viewReject').hidden = !(pending && state.reviews);
      $('#viewApprove').hidden = !(pending && state.reviews);
      $('#viewDlg').showModal();
    }

    // The three decisions end the same way. If someone else got there first, the list is refreshed behind the dialog.
    async function act(btn, box, dlg, path, body, done) {
      btn.disabled = true;
      box.hidden = true;
      try {
        await api(`/requests/${state.open.id}/${path}`, { method: 'POST', body });
        dlg.close();
        toast(done);
        await load();
        $('#list').focus();
      } catch (err) {
        box.textContent = Object.values(err.details || {})[0] || err.message;
        box.hidden = false;
        if (err.status === 409) load();
      } finally { btn.disabled = false; }
    }
    function openOk() {
      $('#viewDlg').close();
      $('#okName').textContent = state.open.title;
      $('#fOkNote').value = '';
      $('#okErr').hidden = true;
      state.who ||= EventForm.picker({ list: '#chosen', search: '#fWho', found: '#whoList', onError: (text) => { $('#okErr').textContent = text; $('#okErr').hidden = false; } });
      state.who.set([]);
      $('#okDlg').showModal();
    }
    function openNo() {
      $('#viewDlg').close();
      $('#noName').textContent = state.open.title;
      $('#fNoNote').value = '';
      $('#noErr').hidden = true;
      $('#noDlg').showModal();
    }
    function openOff() {
      $('#viewDlg').close();
      $('#offName').textContent = state.open.title;
      $('#offErr').hidden = true;
      $('#offDlg').showModal();
    }

    // ---- Start ----
    (async () => {
      const me = await window.ME;
      const user = await DESK.start({ page: 'requests', allow: me.modules?.includes('requests') ? [me.user.role] : ['pr', 'admin'] });
      if (!user) return;
      state.reviews = user.role === 'pr' || user.role === 'admin';
      state.submits = user.role === 'secretary' || user.role === 'admin';
      if (state.reviews) state.status = 'pending';
      $('#fType').replaceChildren(...Object.entries(TYPES).map(([k, l]) => el('option', { value: k }, l)));
      $('#add').hidden = !state.submits;
      $('#app').hidden = false;

      document.querySelectorAll('[data-status]').forEach((b) => b.addEventListener('click', () => { state.status = b.dataset.status; load(); }));
      $('#add').addEventListener('click', openForm);
      $('#reqForm').addEventListener('submit', save);
      $('#formClose').addEventListener('click', () => $('#formDlg').close());
      $('#viewClose').addEventListener('click', () => $('#viewDlg').close());
      $('#viewApprove').addEventListener('click', openOk);
      $('#viewReject').addEventListener('click', openNo);
      $('#viewCancel').addEventListener('click', openOff);
      $('#okClose').addEventListener('click', () => $('#okDlg').close());
      $('#noClose').addEventListener('click', () => $('#noDlg').close());
      $('#offClose').addEventListener('click', () => $('#offDlg').close());
      $('#okForm').addEventListener('submit', (ev) => {
        ev.preventDefault();
        act($('#okGo'), $('#okErr'), $('#okDlg'), 'approve', { assignees: state.who.get(), note: $('#fOkNote').value }, 'อนุมัติคำขอแล้ว สร้างกิจกรรมในปฏิทินงานแล้ว');
      });
      $('#noForm').addEventListener('submit', (ev) => {
        ev.preventDefault();
        act($('#noGo'), $('#noErr'), $('#noDlg'), 'reject', { note: $('#fNoNote').value }, 'แจ้งผลไม่อนุมัติแล้ว');
      });
      $('#offGo').addEventListener('click', () => act($('#offGo'), $('#offErr'), $('#offDlg'), 'cancel', {}, 'ยกเลิกคำขอแล้ว'));

      await load();
      const id = new URLSearchParams(location.search).get('id');
      if (id) {
        try { openView((await api(`/requests/${encodeURIComponent(id)}`)).request); } catch (err) { toast(err.message, true); }
      }
    })();
  </script>
</body>
</html>
